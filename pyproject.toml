[project]
name = "py-yt-transcripts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Philippe BAUCOUR", email = "philippe.baucour@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
py-yt-transcripts = "py_yt_transcripts:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]
