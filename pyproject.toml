[project]
name = "py-yt-transcripts"
version = "0.1.0"
description = "Save the transcript of a YouTube video as Markdown"
readme = "README.md"
authors = [
    { name = "Philippe BAUCOUR", email = "philippe.baucour@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "yt-dlp>=2026.10.26",
]

[project.scripts]
py-yt-transcripts = "py_yt_transcripts:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]
